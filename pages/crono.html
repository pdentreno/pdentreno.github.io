<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PD Timer</title>

    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="../styles/crono.css">
</head>

<body>

    <!-- Botón volver -->
    <a class="back-button" href="../home.html">← Volver</a>

    <details class="mode-selector">
        <summary aria-label="Cambiar de modo: Cronómetro">Cronómetro</summary>
        <nav class="mode-menu" aria-label="Modos de entrenamiento">
            <a href="clock.html">Reloj</a>
            <a href="tabata.html">Intervalos</a>
            <a href="for_time.html">Por tiempo / AMRAP</a>
            <a href="crono.html" aria-current="page">Cronómetro</a>
        </nav>
    </details>

    <button class="fullscreen-button" id="fullscreenBtn" aria-label="Activar pantalla completa" title="Pantalla completa">⛶</button>

    <main class="container timer-stage" id="main-content" tabindex="-1">
        <div class="timer-screen" id="cronoScreen">
            <div id="cronoDisplay" role="timer" aria-label="Tiempo transcurrido" aria-live="off">00:00:00:000</div>
            <div class="crono-format">horas : minutos : segundos : milisegundos</div>
            <div class="control-row">
                <button class="start-button" id="resetBtn">Reiniciar</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        Desarrollado por Lucas Alonso de San Segundo<br>
        <a href="mailto:alonsolucas.developer@gmail.com">alonsolucas.developer@gmail.com</a>
    </footer>
    <img class="footer-logo" src="../images/pd_3.jpeg" alt="Logotipo de Pablo Durán">

    <script src="../scripts/common.js" defer></script>
    <script src="../scripts/crono.js" defer></script>

</body>

</html>
