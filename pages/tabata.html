<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PD Timer</title>

  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/tabata.css">
</head>

<body>

  <!-- Volver -->
  <a class="back-button" href="../home.html">← Volver</a>

  <details class="mode-selector">
    <summary aria-label="Cambiar de modo: Intervalos">Intervalos</summary>
    <nav class="mode-menu" aria-label="Modos de entrenamiento">
      <a href="clock.html">Reloj</a>
      <a href="tabata.html" aria-current="page">Intervalos</a>
      <a href="for_time.html">Por tiempo / AMRAP</a>
      <a href="crono.html">Cronómetro</a>
    </nav>
  </details>

  <!-- Fullscreen -->
  <button class="fullscreen-button" id="fullscreenBtn" aria-label="Activar pantalla completa" title="Pantalla completa">⛶</button>
  <button class="fullscreen-button edit-button hidden" id="editBtn" aria-label="Editar intervalos" title="Editar intervalos">✎</button>

  <main class="container timer-stage" id="main-content" tabindex="-1">

    <!-- =========================
         FORMULARIO
    ========================== -->
    <div class="form">

      <div class="row">
        <label class="label" for="workInput">Trabajo</label>
        <input type="number" id="workInput" min="1" placeholder="0">
        <span class="suffix">segundos</span>
      </div>

      <div class="row">
        <label class="label" for="restInput">Descanso</label>
        <input type="number" id="restInput" min="0" placeholder="0">
        <span class="suffix">segundos</span>
      </div>

      <div class="row">
        <label class="label" for="roundsInput">Rondas</label>
        <input type="number" id="roundsInput" min="1" placeholder="0">
        <span class="suffix"></span>
      </div>

      <div class="row">
        <label class="label" for="setsInput">Series</label>
        <input type="number" id="setsInput" min="1" placeholder="0">
        <span class="suffix"></span>
      </div>

      <div class="row">
        <label class="label" for="restSetsInput">Descanso entre series</label>
        <input type="number" id="restSetsInput" min="0" placeholder="0">
        <span class="suffix">segundos</span>
      </div>

      <button class="start-button">Empezar</button>

      <div class="error-message" id="errorMessage"></div>

    </div>

    <!-- =========================
         TIMER SCREEN
    ========================== -->
    <div id="timerScreen" class="hidden">

      <div class="edit-panel hidden" id="editOverlay">
        <div class="edit-row">
          <div class="edit-field">
            <label for="editWork">Trabajo</label>
            <input type="number" min="1" id="editWork" placeholder="segundos">
          </div>
          <div class="edit-field">
            <label for="editRest">Descanso</label>
            <input type="number" min="0" id="editRest" placeholder="segundos">
          </div>
          <div class="edit-field">
            <label for="editRounds">Rondas</label>
            <input type="number" min="1" id="editRounds" placeholder="0">
          </div>
          <div class="edit-field">
            <label for="editSets">Series</label>
            <input type="number" min="1" id="editSets" placeholder="0">
          </div>
          <div class="edit-field">
            <label for="editRestSets">Descanso entre series</label>
            <input type="number" min="0" id="editRestSets" placeholder="segundos">
          </div>
        </div>
        <div class="edit-actions">
          <button class="start-button" id="confirmEditBtn">Guardar</button>
          <button class="start-button" id="cancelEditBtn">Cancelar</button>
        </div>
        <div class="edit-error-message" id="editErrorMessage"></div>
      </div>

      <div id="timeDisplay" role="timer" aria-label="Tiempo de intervalo" aria-live="off">00:00:00</div>

      <div class="phase-status" role="status" aria-live="polite">
        <div id="phaseDisplay"></div>
        <div id="countdownPaused"></div>
      </div>

    </div>

  </main>

  <footer class="site-footer">
    Desarrollado por Lucas Alonso de San Segundo<br>
    <a href="mailto:alonsolucas.developer@gmail.com">alonsolucas.developer@gmail.com</a>
  </footer>
  <img class="footer-logo" src="../images/pd_3.jpeg" alt="Logotipo de Pablo Durán">

  <script src="../scripts/common.js" defer></script>
  <script src="../scripts/tabata.js" defer></script>

</body>

</html>
