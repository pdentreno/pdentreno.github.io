<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PD Timer</title>

  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/tabata.css">
</head>

<body>

  <!-- Volver -->
  <a class="back-button" href="../index.html">← Volver</a>

  <!-- Header -->
  <div class="top-center-text">TABATA / EMOM</div>

  <!-- Fullscreen -->
  <button class="fullscreen-button" id="fullscreenBtn">⛶</button>
  <button class="fullscreen-button edit-button hidden" id="editBtn">EDIT</button>

  <main class="container">

    <!-- =========================
         FORMULARIO
    ========================== -->
    <div class="form">

      <div class="row">
        <span class="label">WORK</span>
        <input type="number" id="workInput" min="1" placeholder="0">
        <span class="suffix">seconds</span>
      </div>

      <div class="row">
        <span class="label">REST</span>
        <input type="number" id="restInput" min="0" placeholder="0">
        <span class="suffix">seconds</span>
      </div>

      <div class="row">
        <span class="label">ROUNDS</span>
        <input type="number" id="roundsInput" min="1" placeholder="0">
        <span class="suffix"></span>
      </div>

      <div class="row">
        <span class="label">SETS</span>
        <input type="number" id="setsInput" min="1" placeholder="0">
        <span class="suffix"></span>
      </div>

      <div class="row">
        <span class="label">REST SETS</span>
        <input type="number" id="restSetsInput" min="0" placeholder="0">
        <span class="suffix">seconds</span>
      </div>

      <button class="start-button">START</button>

      <div class="error-message" id="errorMessage"></div>

    </div>

    <!-- =========================
         TIMER SCREEN
    ========================== -->
    <div id="timerScreen" class="hidden">

      <div class="edit-panel hidden" id="editOverlay">
        <div class="edit-row">
          <div class="edit-field">
            <span>WORK</span>
            <input type="number" min="1" id="editWork" placeholder="seconds">
          </div>
          <div class="edit-field">
            <span>REST</span>
            <input type="number" min="0" id="editRest" placeholder="seconds">
          </div>
          <div class="edit-field">
            <span>ROUNDS</span>
            <input type="number" min="1" id="editRounds" placeholder="0">
          </div>
          <div class="edit-field">
            <span>SETS</span>
            <input type="number" min="1" id="editSets" placeholder="0">
          </div>
          <div class="edit-field">
            <span>REST SETS</span>
            <input type="number" min="0" id="editRestSets" placeholder="seconds">
          </div>
        </div>
        <div class="edit-actions">
          <button class="start-button" id="confirmEditBtn">CONFIRM</button>
          <button class="start-button" id="cancelEditBtn">CANCEL</button>
        </div>
        <div class="edit-error-message" id="editErrorMessage"></div>
      </div>

      <div id="timeDisplay">00:00:00</div>

      <div id="phaseDisplay"></div>

      <!-- PAUSED (correctamente ubicado como en for_time) -->
      <div id="countdownPaused"></div>

    </div>

  </main>

  <script src="../scripts/common.js" defer></script>
  <script src="../scripts/tabata.js" defer></script>

</body>

</html>
